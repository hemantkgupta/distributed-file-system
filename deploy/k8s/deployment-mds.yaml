apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfs-mds
  namespace: dfs
  labels:
    app: dfs-mds
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dfs-mds
  template:
    metadata:
      labels:
        app: dfs-mds
    spec:
      containers:
        - name: mds
          image: hkg/dfs-mds:0.1.0
          ports:
            - containerPort: 6800
              name: mds
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            tcpSocket:
              port: mds
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dfs-mds
  namespace: dfs
spec:
  selector:
    app: dfs-mds
  ports:
    - port: 6800
      targetPort: 6800
      name: mds
  clusterIP: None
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dfs-mds-quota
  namespace: dfs
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "32"
    limits.memory: 64Gi
